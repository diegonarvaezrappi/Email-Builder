# nginx para Coolify (app.vibes.rappi.com/email-builder).
# Coolify normalmente quita el prefijo antes de llegar aquí; si llega, se acepta igual.
server {
    listen 8000;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /health { access_log off; default_type text/plain; return 200 "ok"; }

    # Por si el proxy NO quita el prefijo.
    location = /email-builder { return 301 /email-builder/; }
    location /email-builder/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché para que cada deploy se vea al recargar;
    # los assets llevan hash en el nombre y se cachean largo.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location / { try_files $uri $uri/ /index.html; }
}
