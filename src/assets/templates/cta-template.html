<head>
	
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- BLOQUEO de dark mode: los templates traen sus colores de marca y el
     auto-dark de Apple Mail (iOS/macOS) los reinterpretaba (fondo oscuro →
     gris claro). "light only" declara que el correo SOLO soporta su esquema
     tal cual — Apple Mail lo respeta y no toca nada. Gmail ignora estas
     metas, pero su transformación sí respeta fondos de color. -->
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">

<style type="text/css">
body a {
    text-decoration: none !important;
}
a {
    text-decoration: none !important;
}
.ii a[href] {
    color: inherit!important;
    text-decoration: none!important;
}

@media (max-width:480px) {
.borde_mobile {
    border: 1px solid rgba(125, 129, 136, 0.5) !important;
    border-radius: 100px !important;
}
