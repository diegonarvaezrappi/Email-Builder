<!-- ============================================================================
     FOOTER B2B · RESTAURANTES
     ============================================================================
     Variante para comunicaciones a comercios aliados (restaurantes). Sale del
     Footer General y conserva su estructura y sus 11 temas, pero el contenido
     es otro: aquí no hay promociones ni membresías, hay soporte y accesos.

     Qué cambia frente al General:
       · La firma NO es elegible. Siempre el bigote — se eliminaron las 12
         ramas por país y la variable `firma`.
       · Copy propio: "Estamos cerca / para apoyarte" (PT-BR en Brasil).
       · TRES botones en vez de uno: WhatsApp de soporte (número por país),
         Portal Partners y Rappi Aliados (ambos con link único).
       · El Centro de ayuda apunta al de partners y va en negrita.
       · NO lleva legales de Turbo, de licores ni de membresía Pro.
       · `cond` se conserva como campo abierto para texto adicional.
     ============================================================================ -->

----------------------------------
------- COPY Y TRES BOTONES ------
----------------------------------
La franja superior de B2B. A diferencia del General, que tiene un solo botón,
aquí van TRES y están siempre los tres:

  1 · Canal de WhatsApp   número de soporte, distinto por país
  2 · Portal Partners     link único, igual en los 9 países
  3 · Rappi Aliados       link único, igual en los 9 países

Con tres botones la franja crece, así que la celda de la firma sube a 170px
—el General usa 90px con uno y 130px con dos—. Solo afecta a escritorio: las
media queries del <head> lo pisan con height:auto!important.
