<!-- SEPARADORES POR TAMAÑO -->

<!-- Mismas clases que en content_moleculas/ (definidas una sola vez en global-styles.html).
     En los banner_moleculas/ reales de hoy el espaciado entre moléculas se maneja con
     margin/padding inline en cada archivo, no con estas clases — se documentan aquí como
     utilidad disponible si un banner necesita un separador de altura fija entre bloques. -->

<!-- SEPARADOR L (sin sufijo) — 16px — entre secciones grandes, ej. entre el banner completo y el CTA/contenido siguiente -->
<div class="separador"></div>

<!-- SEPARADOR M — 10px — separación intermedia entre bloques dentro del banner -->
<div class="separador-M"></div>

<!-- SEPARADOR S — 4px — separación mínima entre moléculas del banner -->
<div class="separador-S"></div>
