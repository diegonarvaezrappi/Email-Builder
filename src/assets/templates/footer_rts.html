     FOOTER RTS (Repartidores)
     ============================================================================
     Reescrito el 2026-09-17 sobre la ESTRUCTURA DEL FOOTER GENERAL: misma
     franja superior (firma + botones), misma fila de links y mismo bloque de
     legales. Lo que cambia es el contenido, que es el de repartidores.

     Diferencias de fondo con el General:
       · NO lleva legales de Turbo, de licores ni de membresía Pro.
       · Los links de la fila son los de RTS (T&C de repartidores, blog propio).
       · Los canales no son solo WhatsApp: según el país son WhatsApp, Telegram
         o Facebook, y en MX y CO son DOS.
       · La firma es el bigote en los 11 temas — RTS no cambia de firma por país.

     Los 11 temas del STYLE LOOK son los mismos del General, para que el footer
     de repartidores responda al tema del mail igual que el de usuarios.
     ============================================================================ -->
